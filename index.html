<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>가위바위보</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #3a3a5f);
      color: white;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 30px;
      padding-top: 30px;
    }

    h1 {
      text-align: center;
      width: 100%;
      position: absolute;
      top: 0;
    }

    .game-box {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      width: 420px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-top: 60px;
    }

    .log-box {
      width: 300px;
      height: 400px;
      overflow-y: auto;
      background: rgba(0,0,0,0.4);
      border-radius: 15px;
      padding: 15px;
      margin-top: 60px;
    }
    .log-box::-webkit-scrollbar {
      width: 8px;
    }

    /* 스크롤 배경 */
    .log-box::-webkit-scrollbar-track {
      background: transparent;
    }

    /* 움직이는 바 */
    .log-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
    }

    /* 호버 시 */
    .log-box::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.6);
    }

    .log-box h2 {
      margin-top: 0;
      font-size: 20px;
      border-bottom: 1px solid #aaa;
      padding-bottom: 5px;
    }

    .log {
      font-size: 14px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 5px;
    }

    #aiChoice { font-size: 22px; margin-bottom: 15px; color: #ffd369; }
    #status { font-size: 18px; margin-bottom: 20px; color: #aaa; }

    .buttons button {
      font-size: 26px;
      margin: 10px;
      padding: 15px 20px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    .buttons button:hover { transform: scale(1.1); }

    .scissors { background: #ff6b6b; }
    .paper { background: #4ecdc4; }
    .rock { background: #5f6caf; }

    #result { margin-top: 20px; font-size: 22px; min-height: 50px; }
    #score { margin-top: 15px; font-size: 16px; color: #ddd; }
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
    
      text-align: center;
      padding: 10px 0;
    
      background: rgba(0, 0, 0, 0.4); 
      backdrop-filter: blur(5px);  
    
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    footer {
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.6),
        rgba(0,0,0,0)
      );
    }
  </style>
</head>
<body>

<h1>✊✌️✋ 가위바위보</h1>

<div class="game-box">
  <div id="aiChoice">AI 행동 대기중</div>
  <div id="status">행동을 골라주세요</div>

  <div class="buttons">
    <button class="scissors" onclick="play(1)">✌️</button>
    <button class="paper" onclick="play(2)">✋</button>
    <button class="rock" onclick="play(3)">✊</button>
  </div>

  <div id="result"></div>
  <div id="score">승: 0 | 패: 0 | 무: 0</div>
</div>

<div class="log-box">
  <h2>📜 로그</h2>
  <div id="logs"></div>
</div>
<footer id="footerText">
  tip:AI는 70% 확률로 다른걸 낸답니다
</footer>
<script src="script.js"></script>
</body>
</html>
