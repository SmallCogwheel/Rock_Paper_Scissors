<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>가위바위보</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<a class="github-btn" href="https://github.com/SmallCogwheel/-" target="_blank">
  <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub">
</a>
<h1>✊✌️✋ 가위바위보</h1>

<div class="game-box">
  <div id="aiChoice">AI 행동 대기중</div>
  <div id="status">행동을 골라주세요</div>

  <div class="buttons">
    <button class="scissors" onclick="play(1)">✌️</button>
    <button class="paper" onclick="play(2)">✋</button>
    <button class="rock" onclick="play(3)">✊</button>
  </div>

  <div id="result"></div>
  <div id="score">승: 0 | 패: 0 | 무: 0</div>
</div>

<div class="log-box">
  <h2>📜 로그</h2>
  <div id="logs"></div>
</div>
<footer id="footerText">
  tip:AI는 70% 확률로 다른걸 낸답니다
</footer>
<script src="script.js"></script>
</body>
</html>
